<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <meta name="theme-color" content="#2563eb">
    
    <title>Сравнение офферов | BankiPlace</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">Banki<span>Place</span></a>
            <nav class="nav">
                <a href="catalog.html">Каталог</a>
                <a href="blog.html">Блог</a>
            </nav>
        </div>
    </header>

    <section class="catalog" style="padding: 50px 0; min-height: 60vh;">
        <div class="container">
            <h1>Сравнение офферов</h1>
            <div id="compare-container" style="margin-top: 30px; overflow-x: auto;">
                <p>Загрузка данных...</p>
            </div>
        </div>
    </section>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('compare-container');
        const compareList = JSON.parse(localStorage.getItem('compareList')) || [];

        if (compareList.length === 0) {
            container.innerHTML = '<p>Вы пока не выбрали офферы для сравнения.</p><br><a href="catalog.html" class="btn btn--primary">Перейти в каталог</a>';
            return;
        }

        try {
            const response = await fetch('offers.json');
            const data = await response.json();
            
            let allOffers = data.offers || data;
            let offersArray = Array.isArray(allOffers) ? allOffers : Object.values(allOffers);
            
            const selectedOffers = offersArray.filter(offer => {
                const offerId = offer.id || offer.offer_id;
                return compareList.includes(offerId);
            });

            if (selectedOffers.length === 0) {
                container.innerHTML = '<p>Ошибка: выбранные офферы не найдены в базе.</p><br><a href="catalog.html" class="btn btn--primary">Вернуться в каталог</a>';
                return;
            }

            // Собираем все уникальные названия характеристик из выбранных офферов
            const allSpecs = new Set();
            selectedOffers.forEach(offer => {
                if (offer.specs) {
                    Object.keys(offer.specs).forEach(key => allSpecs.add(key));
                }
            });
            const specKeys = Array.from(allSpecs);

            // Строим таблицу
            let tableHTML = '<table style="width: 100%; border-collapse: collapse; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">';
            
            // Заголовки (Названия офферов)
            tableHTML += '<tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;"><th style="padding: 20px; text-align: left; min-width: 150px;">Характеристика</th>';
            selectedOffers.forEach(offer => {
                tableHTML += `<th style="padding: 20px; text-align: center; min-width: 200px; font-size: 18px;">${offer.title || 'Без названия'}</th>`;
            });
            tableHTML += '</tr>';

            // Строка банка
            tableHTML += '<tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 15px 20px; font-weight: bold; color: #64748b;">Банк / МФО</td>';
            selectedOffers.forEach(offer => tableHTML += `<td style="padding: 15px 20px; text-align: center;">${offer.bank_name || '—'}</td>`);
            tableHTML += '</tr>';

            // Строки с характеристиками
            specKeys.forEach(specName => {
                tableHTML += `<tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 15px 20px; font-weight: bold; color: #64748b;">${specName}</td>`;
                selectedOffers.forEach(offer => {
                    const val = offer.specs && offer.specs[specName] ? offer.specs[specName] : '—';
                    tableHTML += `<td style="padding: 15px 20px; text-align: center; font-weight: 500;">${val}</td>`;
                });
                tableHTML += '</tr>';
            });

            // Кнопка оформить
            tableHTML += '<tr><td style="padding: 20px;"></td>';
            selectedOffers.forEach(offer => {
                tableHTML += `<td style="padding: 20px; text-align: center;"><a href="${offer.url || '#'}" target="_blank" rel="nofollow sponsored noopener" class="btn btn--card" style="display: inline-block; width: 100%;">Оформить</a></td>`;
            });
            tableHTML += '</tr>';

            tableHTML += '</table>';
            container.innerHTML = tableHTML;

        } catch (error) {
            console.error(error);
            container.innerHTML = '<p>Ошибка загрузки данных. Пожалуйста, обновите страницу.</p>';
        }
    });
</script>
</body>
</html>
