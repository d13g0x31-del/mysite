<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение офферов | BankiPlace</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">Banki<span>Place</span></a>
            <nav class="nav">
                <a href="catalog.html">Каталог</a>
                <a href="blog.html">Блог</a>
            </nav>
        </div>
    </header>

    <section class="catalog" style="padding: 50px 0;">
        <div class="container">
            <h1>Сравнение офферов</h1>
            <div id="compare-container" style="margin-top: 30px; overflow-x: auto;">
                <p>Загрузка данных...</p>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('compare-container');
            const compareList = JSON.parse(localStorage.getItem('compareList')) || [];

            if (compareList.length === 0) {
                container.innerHTML = '<p>Вы пока не выбрали офферы для сравнения.</p><br><a href="catalog.html" class="btn btn--primary">Перейти в каталог</a>';
                return;
            }

            try {
                const response = await fetch('offers.json');
                const data = await response.json();
                const allOffers = data.offers;

                let tableHTML = '<table style="width: 100%; border-collapse: collapse; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">';
                tableHTML += '<tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;"><th style="padding: 20px; text-align: left;">Характеристика</th>';
                
                let selectedOffers = [];
                compareList.forEach(id => {
                    if (allOffers[id]) {
                        selectedOffers.push(allOffers[id]);
                        tableHTML += `<th style="padding: 20px; text-align: center; min-width: 200px;">${allOffers[id].title}</th>`;
                    }
                });
                tableHTML += '</tr>';

                // Строка банка
                tableHTML += '<tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 15px 20px; font-weight: bold; color: #64748b;">Банк</td>';
                selectedOffers.forEach(offer => tableHTML += `<td style="padding: 15px 20px; text-align: center;">${offer.bank_name || '—'}</td>`);
                tableHTML += '</tr>';

                // Строка особенностей (характеристик)
                tableHTML += '<tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 15px 20px; font-weight: bold; color: #64748b;">Особенности</td>';
                selectedOffers.forEach(offer => {
                    let feats = (offer.features || []).map(f => `<li>${f}</li>`).join('');
                    tableHTML += `<td style="padding: 15px 20px; text-align: left;"><ul style="padding-left: 15px; margin: 0; font-size: 14px;">${feats || '—'}</ul></td>`;
                });
                tableHTML += '</tr>';

                // Строка кнопок
                tableHTML += '<tr><td style="padding: 20px;"></td>';
                selectedOffers.forEach(offer => {
                    tableHTML += `<td style="padding: 20px; text-align: center;"><a href="${offer.url}" target="_blank" class="btn btn--card" style="display: inline-block; width: 100%;">Оформить</a></td>`;
                });
                tableHTML += '</tr>';

                tableHTML += '</table>';
                container.innerHTML = tableHTML;

            } catch (error) {
                container.innerHTML = '<p>Ошибка загрузки данных. Пожалуйста, обновите страницу.</p>';
            }
        });
    </script>
</body>
</html>
